[package]
name = "shared-types"
version = "0.1.0"
edition = "2024"

[dependencies]
serde     = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
ciborium  = { version = "0.2.2",   default-features = false }
# Optional dependencies
specta      = { version = "=2.0.0-rc.25",  optional = true }
embassy-usb = { version = "0.6.0",  optional = true }
defmt       = { version = "1.1.1",  optional = true }
tokio       = { version = "1.53.1", optional = true }

[features]
usb = ["dep:embassy-usb"]
defmt = ["dep:defmt"]
tokio = ["dep:tokio"]

std = ["serde/std"]
bindings = ["specta", "std"]
